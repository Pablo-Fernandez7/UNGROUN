
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baggy Sweatpants | UNGROUN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">UNGROUN</div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="index.html#collection">SHOP</a>
            <a href="carrito.html">CART (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <section class="product-detail">

        <img src="images/baggy.jpg" alt="Baggy Sweatpants">

        <div class="product-info">

            <h1>BAGGY SWEATPANTS</h1>

            <p class="price">€59.90</p>

            <p class="description">
                Premium heavyweight baggy sweatpants.
                Relaxed fit. Designed for everyday wear.
            </p>

            <div class="size-selector">
                <p>SELECT SIZE</p>

                <div class="sizes">
                    <button class="size-btn">S</button>
                    <button class="size-btn">M</button>
                    <button class="size-btn">L</button>
                    <button class="size-btn">XL</button>
                </div>
            </div>

            <details class="size-guide">
                <summary>SIZE GUIDE</summary>

                <table>
                    <tr>
                        <th>SIZE</th>
                        <th>WAIST</th>
                        <th>LENGTH</th>
                    </tr>
                    <tr>
                        <td>S</td>
                        <td>72 cm</td>
                        <td>104 cm</td>
                    </tr>
                    <tr>
                        <td>M</td>
                        <td>76 cm</td>
                        <td>106 cm</td>
                    </tr>
                    <tr>
                        <td>L</td>
                        <td>80 cm</td>
                        <td>108 cm</td>
                    </tr>
                    <tr>
                        <td>XL</td>
                        <td>84 cm</td>
                        <td>110 cm</td>
                    </tr>
                </table>
            </details>

            <button class="buy-btn">ADD TO CART</button>

            <p id="cart-message"></p>

            <a href="index.html#collection" class="back-link">
                BACK TO COLLECTION
            </a>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
